<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a12"/>
      <stop offset="100%" stop-color="#060807"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Couch: back cushion -->
  <rect x="76" y="126" width="360" height="144" rx="36" fill="#bef264"/>
  <!-- Seat (drawn before arms so arms appear in front) -->
  <rect x="116" y="240" width="280" height="90" rx="18" fill="#9dc83c"/>
  <!-- Cushion divider -->
  <line x1="256" y1="246" x2="256" y2="324" stroke="#7aaa28" stroke-width="3" stroke-linecap="round"/>
  <!-- Left arm (in front) -->
  <rect x="76" y="158" width="80" height="172" rx="30" fill="#bef264"/>
  <!-- Right arm (in front) -->
  <rect x="356" y="158" width="80" height="172" rx="30" fill="#bef264"/>
  <!-- Legs -->
  <rect x="144" y="324" width="24" height="56" rx="8" fill="#bef264" opacity="0.4"/>
  <rect x="344" y="324" width="24" height="56" rx="8" fill="#bef264" opacity="0.4"/>
</svg>
