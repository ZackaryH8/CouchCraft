<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#192415"/>
      <stop offset="100%" stop-color="#060807"/>
    </radialGradient>
    <radialGradient id="icon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#bef264" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card-clip">
      <rect width="600" height="800"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Background -->
    <rect width="600" height="800" fill="url(#bg-glow)"/>

    <!-- Subtle grid lines -->
    <g stroke="#1a2018" stroke-width="1" opacity="0.6">
      <line x1="0"   y1="133" x2="600" y2="133"/>
      <line x1="0"   y1="266" x2="600" y2="266"/>
      <line x1="0"   y1="399" x2="600" y2="399"/>
      <line x1="0"   y1="532" x2="600" y2="532"/>
      <line x1="100" y1="0"   x2="100" y2="640"/>
      <line x1="200" y1="0"   x2="200" y2="640"/>
      <line x1="300" y1="0"   x2="300" y2="640"/>
      <line x1="400" y1="0"   x2="400" y2="640"/>
      <line x1="500" y1="0"   x2="500" y2="640"/>
    </g>

    <!-- Icon glow -->
    <ellipse cx="300" cy="310" rx="220" ry="160" fill="url(#icon-glow)"/>

    <!-- Couch icon, centered at (300, 310), ~320x200 -->
    <!-- Back cushion -->
    <rect x="140" y="208" width="320" height="128" rx="32" fill="#bef264"/>
    <!-- Seat -->
    <rect x="176" y="298" width="248" height="80" rx="16" fill="#9dc83c"/>
    <!-- Cushion divider -->
    <line x1="300" y1="304" x2="300" y2="372" stroke="#7aaa28" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left arm -->
    <rect x="140" y="236" width="72" height="152" rx="26" fill="#bef264"/>
    <!-- Right arm -->
    <rect x="388" y="236" width="72" height="152" rx="26" fill="#bef264"/>
    <!-- Legs -->
    <rect x="200" y="378" width="22" height="50" rx="7" fill="#bef264" opacity="0.35"/>
    <rect x="378" y="378" width="22" height="50" rx="7" fill="#bef264" opacity="0.35"/>

    <!-- "COUCH" -->
    <text
      x="300" y="498"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-weight="900"
      font-size="80"
      letter-spacing="-2"
      fill="#ffffff"
    >COUCH</text>

    <!-- "CRAFT" -->
    <text
      x="300" y="574"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-weight="900"
      font-size="80"
      letter-spacing="-2"
      fill="#bef264"
    >CRAFT</text>

    <!-- Tagline -->
    <text
      x="300" y="612"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-weight="500"
      font-size="15"
      letter-spacing="5"
      fill="#4a6638"
    >LAUNCHER</text>

    <!-- Minecraft-style ground band -->
    <!-- Grass top -->
    <rect x="0" y="660" width="600" height="16" fill="#bef264"/>
    <!-- Grass variation dots -->
    <rect x="0"   y="648" width="6"  height="12" rx="2" fill="#bef264"/>
    <rect x="20"  y="652" width="5"  height="8"  rx="2" fill="#bef264"/>
    <rect x="42"  y="646" width="7"  height="14" rx="2" fill="#bef264"/>
    <rect x="68"  y="651" width="5"  height="9"  rx="2" fill="#bef264"/>
    <rect x="88"  y="648" width="6"  height="12" rx="2" fill="#bef264"/>
    <rect x="110" y="653" width="4"  height="7"  rx="2" fill="#bef264"/>
    <rect x="134" y="647" width="6"  height="13" rx="2" fill="#bef264"/>
    <rect x="155" y="650" width="5"  height="10" rx="2" fill="#bef264"/>
    <rect x="180" y="648" width="7"  height="12" rx="2" fill="#bef264"/>
    <rect x="205" y="652" width="5"  height="8"  rx="2" fill="#bef264"/>
    <rect x="228" y="646" width="6"  height="14" rx="2" fill="#bef264"/>
    <rect x="252" y="651" width="5"  height="9"  rx="2" fill="#bef264"/>
    <rect x="275" y="648" width="7"  height="12" rx="2" fill="#bef264"/>
    <rect x="300" y="653" width="4"  height="7"  rx="2" fill="#bef264"/>
    <rect x="322" y="647" width="6"  height="13" rx="2" fill="#bef264"/>
    <rect x="348" y="650" width="5"  height="10" rx="2" fill="#bef264"/>
    <rect x="370" y="648" width="6"  height="12" rx="2" fill="#bef264"/>
    <rect x="395" y="652" width="5"  height="8"  rx="2" fill="#bef264"/>
    <rect x="418" y="646" width="7"  height="14" rx="2" fill="#bef264"/>
    <rect x="442" y="651" width="5"  height="9"  rx="2" fill="#bef264"/>
    <rect x="465" y="648" width="6"  height="12" rx="2" fill="#bef264"/>
    <rect x="490" y="653" width="4"  height="7"  rx="2" fill="#bef264"/>
    <rect x="510" y="647" width="6"  height="13" rx="2" fill="#bef264"/>
    <rect x="534" y="650" width="5"  height="10" rx="2" fill="#bef264"/>
    <rect x="558" y="648" width="7"  height="12" rx="2" fill="#bef264"/>
    <rect x="582" y="652" width="18" height="8"  rx="2" fill="#bef264"/>
    <!-- Dirt layer -->
    <rect x="0" y="676" width="600" height="124" fill="#1c1007"/>
    <!-- Dirt texture blocks -->
    <rect x="0"   y="676" width="40" height="40" fill="#211305"/>
    <rect x="80"  y="676" width="40" height="40" fill="#1a0f04"/>
    <rect x="160" y="676" width="40" height="40" fill="#231406"/>
    <rect x="240" y="676" width="40" height="40" fill="#1e1105"/>
    <rect x="320" y="676" width="40" height="40" fill="#201207"/>
    <rect x="400" y="676" width="40" height="40" fill="#191004"/>
    <rect x="480" y="676" width="40" height="40" fill="#221305"/>
    <rect x="40"  y="716" width="40" height="40" fill="#1a1005"/>
    <rect x="120" y="716" width="40" height="40" fill="#221405"/>
