    <rect x="80"  y="756" width="40" height="44" fill="#231407"/>
    <rect x="160" y="756" width="40" height="44" fill="#1a0f04"/>
    <rect x="240" y="756" width="40" height="44" fill="#211205"/>
    <rect x="320" y="756" width="40" height="44" fill="#1c1006"/>
    <rect x="400" y="756" width="40" height="44" fill="#241507"/>
    <rect x="480" y="756" width="40" height="44" fill="#201105"/>
    <rect x="560" y="756" width="40" height="44" fill="#1b1004"/>
