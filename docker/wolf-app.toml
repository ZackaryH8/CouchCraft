# CouchCraft — Wolf app config
# Add this block to your Wolf config.toml under [[profiles.apps]]

[[profiles.apps]]
title = "CouchCraft"
start_virtual_compositor = true

[profiles.apps.runner]
type = "docker"
name = "WolfCouchCraft"
image = "ghcr.io/zackaryh8/couchcraft:latest"
mounts = []
env = [
  "RUN_SWAY=true",
  "GOW_REQUIRED_DEVICES=/dev/input/event* /dev/dri/* /dev/nvidia*",
]
devices = []
ports = []
base_create_json = """
{
  "HostConfig": {
    "IpcMode": "host",
    "CapAdd": ["NET_RAW", "MKNOD", "NET_ADMIN"],
    "Privileged": false,
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
"""
